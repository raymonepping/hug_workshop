- name: Seed the canonical dataset
  hosts: localhost
  gather_facts: false
  vars:
    lab: "{{ lookup('ansible.builtin.file', runtime + '/metadata.json') | from_json }}"
  tasks:
    - name: Converge the dataset using a single transactional import
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ playbook_dir }}/../scripts/database.py"
          - seed
          - "{{ runtime }}"
          - "{{ lab.name }}"
      register: seeded
      changed_when: (seeded.stdout | from_json).changed
